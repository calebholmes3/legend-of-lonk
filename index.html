<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>The Legend of Lonk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="screen"><canvas id="game" width="256" height="224"></canvas></div>
<!-- the on-screen pad, only shown on touch screens (see touch.js) -->
<div id="pad">
  <div id="dpad">
    <div class="arm up"></div><div class="arm down"></div><div class="arm left"></div><div class="arm right"></div>
    <div class="hub"></div>
  </div>
  <div id="start" data-code="TouchStart">START</div>
  <div id="ab">
    <!-- same order as the HUD: sword (A) on the left, item (B) on the right -->
    <div class="btn" data-code="TouchA"><span>A</span></div>
    <div class="btn" data-code="TouchB"><span>B</span></div>
  </div>
</div>
<!-- plain scripts (not modules) so the game runs straight from the file system; order matters -->
<script src="js/core.js"></script>
<script src="js/touch.js"></script>
<script src="js/sprites.js"></script>
<script src="js/font.js"></script>
<script src="js/tiles.js"></script>
<script src="js/overworld.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/game.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/pause.js"></script>
<script src="js/ocarina.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
